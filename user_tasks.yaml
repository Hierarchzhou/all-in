# 用户自定义任务 - 带可视化进度反馈
# 任务1: 分析图片
# 任务2: 全网信息收集和引流工作流设计

max_instances: 2  # 2个任务并行

tasks:
  - id: "task-1-analyze-image"
    name: "任务1: 分析用户图片"
    prompt: |
      【重要】请详细分析这张图片：/mnt/c/Users/Administrator/Desktop/accc0c2a-2e24-454c-961f-a3aa9db9142c.png

      请按以下步骤执行并给出清晰的进度反馈：

      ✅ 步骤1: 读取图片内容
      ✅ 步骤2: 识别图片类型（截图/设计图/思维导图/流程图等）
      ✅ 步骤3: 提取核心信息
      ✅ 步骤4: 分析图片中的关键元素
      ✅ 步骤5: 给出详细的分析报告

      输出格式：
      # 图片分析报告

      ## 1. 图片基本信息
      - 类型：
      - 内容概述：

      ## 2. 关键元素
      - 元素1：
      - 元素2：

      ## 3. 深度分析
      - 核心主题：
      - 可能的用途：
      - 建议操作：

      ## 4. 下一步建议
    working_dir: "."
    allowed_tools:
      - Read
      - Bash
    priority: 1

  - id: "task-2-traffic-workflow"
    name: "任务2: 全网信息收集和引流工作流设计"
    prompt: |
      【重要】设计一个"全网信息收集 + 自动化引流"的工作流方案

      请按以下步骤执行并给出清晰的进度反馈：

      ✅ 步骤1: 调研现有项目中相关的工具和脚本
         - 搜索项目中是否有爬虫、API、数据收集相关代码
         - 使用 Glob 和 Grep 工具查找

      ✅ 步骤2: 设计信息收集架构
         - 数据源（微博、知乎、小红书、B站等）
         - 采集方式（API/爬虫/RSS）
         - 数据存储方案

      ✅ 步骤3: 设计引流自动化方案
         - 内容生成策略
         - 发布渠道
         - 自动化工具选择

      ✅ 步骤4: 给出完整工作流设计

      输出格式：
      # 全网信息收集和引流工作流设计

      ## 1. 现有资源分析
      （搜索项目中相关文件和工具）

      ## 2. 信息收集架构
      ### 2.1 数据源
      - 平台1: 采集方式、频率、内容类型
      - 平台2: ...

      ### 2.2 技术方案
      - 爬虫框架：
      - API集成：
      - 数据清洗：

      ## 3. 引流自动化方案
      ### 3.1 内容生成
      - 策略1:
      - 策略2:

      ### 3.2 发布渠道
      - 渠道1:
      - 渠道2:

      ### 3.3 自动化工具
      - 工具1:
      - 工具2:

      ## 4. 完整工作流图
      ```
      数据采集 → 数据处理 → 内容生成 → 自动发布 → 效果监控
      ```

      ## 5. 实施步骤和优先级
      - P0: 立即执行
      - P1: 短期
      - P2: 中期

      ## 6. 风险和注意事项
    working_dir: "."
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Bash
    priority: 1
