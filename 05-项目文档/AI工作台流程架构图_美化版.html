<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI工作台流程架构图 - All-In System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 动态背景 */
        .bg-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background: linear-gradient(125deg, #0a0e27 0%, #162447 25%, #1f4068 50%, #162447 75%, #0a0e27 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 网格背景 */
        .grid-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(0, 183, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 183, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 10s linear infinite;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* 粒子效果 */
        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(0, 183, 255, 0.8) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-1000px) translateX(100px);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #00b7ff;
            font-size: 2.5em;
            font-weight: 300;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(0, 183, 255, 0.5);
            letter-spacing: 2px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(0, 183, 255, 0.5); }
            to { text-shadow: 0 0 30px rgba(0, 183, 255, 0.8), 0 0 40px rgba(0, 183, 255, 0.5); }
        }

        .subtitle {
            color: #64b5f6;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .control-panel {
            background: rgba(22, 36, 71, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            border: 1px solid rgba(0, 183, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 183, 255, 0.1);
        }

        .btn {
            padding: 10px 24px;
            border: 1px solid rgba(0, 183, 255, 0.3);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 183, 255, 0.05);
            color: #64b5f6;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 183, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            color: #fff;
            border-color: #00b7ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 183, 255, 0.4);
        }

        .btn.active {
            background: linear-gradient(135deg, #00b7ff 0%, #0083b0 100%);
            color: white;
            border-color: transparent;
        }

        #canvas-container {
            background: rgba(22, 36, 71, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow:
                0 20px 60px rgba(0, 183, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 183, 255, 0.2);
        }

        #canvas-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00b7ff, transparent, #00b7ff);
            border-radius: 20px;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s;
        }

        #canvas-container:hover::before {
            opacity: 0.3;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #architecture-canvas {
            display: block;
            margin: 0 auto;
        }

        .tooltip {
            position: absolute;
            background: linear-gradient(135deg, rgba(22, 36, 71, 0.95) 0%, rgba(31, 64, 104, 0.95) 100%);
            color: #00b7ff;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 13px;
            pointer-events: none;
            z-index: 1000;
            display: none;
            border: 1px solid rgba(0, 183, 255, 0.5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        .tooltip::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(31, 64, 104, 0.95);
        }

        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(22, 36, 71, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(0, 183, 255, 0.2);
            font-size: 12px;
            color: #64b5f6;
        }

        .legend-title {
            color: #00b7ff;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }

        .legend-item:hover {
            transform: translateX(5px);
        }

        .legend-line {
            width: 30px;
            height: 3px;
            margin-right: 12px;
            border-radius: 2px;
            box-shadow: 0 0 10px currentColor;
        }

        .stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 20px;
        }

        .stat-card {
            background: rgba(22, 36, 71, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 183, 255, 0.2);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 183, 255, 0.2);
        }

        .stat-number {
            color: #00b7ff;
            font-size: 24px;
            font-weight: bold;
        }

        .stat-label {
            color: #64b5f6;
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="grid-bg"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <h1>AI WORKSPACE ARCHITECTURE</h1>
        <div class="subtitle">智能工作流程架构可视化系统</div>

        <div class="control-panel">
            <button class="btn active" onclick="showView('current')">
                <span style="position: relative; z-index: 1;">当前架构</span>
            </button>
            <button class="btn" onclick="showView('optimized')">
                <span style="position: relative; z-index: 1;">优化架构</span>
            </button>
            <button class="btn" onclick="toggleAnimation()">
                <span style="position: relative; z-index: 1;">动画效果</span>
            </button>
            <button class="btn" onclick="resetView()">
                <span style="position: relative; z-index: 1;">重置视图</span>
            </button>
        </div>

        <div id="canvas-container">
            <canvas id="architecture-canvas"></canvas>
            <div class="tooltip" id="tooltip"></div>

            <div class="legend">
                <div class="legend-title">连接类型</div>
                <div class="legend-item">
                    <div class="legend-line" style="background: linear-gradient(90deg, #00ff88, #00cc66);"></div>
                    <span>数据流</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: linear-gradient(90deg, #ff9800, #ff6b00);"></div>
                    <span>控制流</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: linear-gradient(90deg, #00b7ff, #0083b0);"></div>
                    <span>反馈流</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: linear-gradient(90deg, #e91e63, #c2185b);"></div>
                    <span>元规则</span>
                </div>
            </div>

            <div class="stats" id="stats"></div>
        </div>
    </div>

    <script>
        // 创建粒子效果
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        createParticles();

        const canvas = document.getElementById('architecture-canvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');

        // 设置画布大小
        canvas.width = 1200;
        canvas.height = 700;

        // 动画控制
        let animationEnabled = true;
        let animationFrame = 0;
        let currentView = 'current';
        let mouseX = 0;
        let mouseY = 0;

        // 节点定义 - 优化位置布局
        const nodes = {
            current: {
                // 输入层 - 垂直排列
                input1: { x: 120, y: 150, label: '语音输入', type: 'input', color: '#ff4757', icon: '🎤' },
                input2: { x: 120, y: 250, label: '文字对话', type: 'input', color: '#ff4757', icon: '💬' },
                input3: { x: 120, y: 350, label: '文件上传', type: 'input', color: '#ff4757', icon: '📁' },
                input4: { x: 120, y: 450, label: '录音文件', type: 'input', color: '#ff4757', icon: '🎵' },
                input5: { x: 120, y: 550, label: '网页内容', type: 'input', color: '#ff4757', icon: '🌐' },

                // 处理层 - 混乱分布
                process1: { x: 450, y: 180, label: '聊天汇总', type: 'process', color: '#ffa502', icon: '📊' },
                process2: { x: 450, y: 300, label: '聊天总结', type: 'process', color: '#ffa502', icon: '📝' },
                process3: { x: 450, y: 420, label: '经验汇总', type: 'process', color: '#ffa502', icon: '💡' },
                process4: { x: 550, y: 250, label: '录音整理', type: 'process', color: '#ffa502', icon: '🎧' },
                process5: { x: 550, y: 500, label: '内容分析', type: 'process', color: '#ffa502', icon: '🔍' },

                // 输出层
                output1: { x: 850, y: 200, label: 'Markdown文档', type: 'output', color: '#2ed573', icon: '📄' },
                output2: { x: 850, y: 300, label: '对话记录', type: 'output', color: '#2ed573', icon: '💾' },
                output3: { x: 850, y: 400, label: '分析报告', type: 'output', color: '#2ed573', icon: '📈' },
                output4: { x: 850, y: 500, label: '任务清单', type: 'output', color: '#2ed573', icon: '✅' }
            },
            optimized: {
                // 输入层 - 整齐排列
                input1: { x: 80, y: 300, label: '对话输入', type: 'input', color: '#00b7ff', icon: '💬', glow: true },
                input2: { x: 80, y: 380, label: '文件输入', type: 'input', color: '#00b7ff', icon: '📁', glow: true },
                input3: { x: 80, y: 460, label: '网络输入', type: 'input', color: '#00b7ff', icon: '🌐', glow: true },
                input4: { x: 80, y: 540, label: '音频输入', type: 'input', color: '#00b7ff', icon: '🎵', glow: true },

                // 预处理层
                pre1: { x: 250, y: 340, label: '格式转换', type: 'preprocess', color: '#26c6da', icon: '🔄' },
                pre2: { x: 250, y: 420, label: '内容识别', type: 'preprocess', color: '#26c6da', icon: '🏷️' },
                pre3: { x: 250, y: 500, label: '分类标记', type: 'preprocess', color: '#26c6da', icon: '📌' },

                // 核心引擎 - 中心位置，更大
                core: { x: 450, y: 420, label: '智能调度中心', type: 'core', color: '#00ff88', icon: '🧠', size: 70, pulse: true },

                // 功能模块
                func1: { x: 650, y: 320, label: '信息提取', type: 'function', color: '#4fc3f7', icon: '⚡' },
                func2: { x: 650, y: 400, label: '内容分析', type: 'function', color: '#4fc3f7', icon: '🔬' },
                func3: { x: 650, y: 480, label: '知识整理', type: 'function', color: '#4fc3f7', icon: '📚' },
                func4: { x: 650, y: 560, label: '任务管理', type: 'function', color: '#4fc3f7', icon: '📋' },

                // 知识库
                kb1: { x: 850, y: 300, label: '对话历史', type: 'knowledge', color: '#ffb347', icon: '🗂️' },
                kb2: { x: 850, y: 380, label: '知识图谱', type: 'knowledge', color: '#ffb347', icon: '🗺️' },
                kb3: { x: 850, y: 460, label: '经验总结', type: 'knowledge', color: '#ffb347', icon: '💎' },
                kb4: { x: 850, y: 540, label: '模板库', type: 'knowledge', color: '#ffb347', icon: '🎨' },

                // 输出层
                out1: { x: 1050, y: 320, label: '实时记录', type: 'output', color: '#00ff88', icon: '📝' },
                out2: { x: 1050, y: 400, label: '定期报告', type: 'output', color: '#00ff88', icon: '📊' },
                out3: { x: 1050, y: 480, label: '知识文档', type: 'output', color: '#00ff88', icon: '📚' },
                out4: { x: 1050, y: 560, label: '任务看板', type: 'output', color: '#00ff88', icon: '📌' },

                // 元规则系统 - 顶部控制
                meta1: { x: 350, y: 150, label: '工作流规则', type: 'meta', color: '#e91e63', icon: '⚙️' },
                meta2: { x: 450, y: 120, label: '自动化触发', type: 'meta', color: '#e91e63', icon: '🚀' },
                meta3: { x: 550, y: 150, label: '输出模板', type: 'meta', color: '#e91e63', icon: '📐' }
            }
        };

        // 连接定义
        const connections = {
            current: [
                // 混乱的连接
                { from: 'input1', to: 'process1', type: 'data' },
                { from: 'input1', to: 'process2', type: 'data' },
                { from: 'input2', to: 'process1', type: 'data' },
                { from: 'input2', to: 'process2', type: 'data' },
                { from: 'input2', to: 'process3', type: 'data' },
                { from: 'input3', to: 'process3', type: 'data' },
                { from: 'input3', to: 'process5', type: 'data' },
                { from: 'input4', to: 'process4', type: 'data' },
                { from: 'input5', to: 'process5', type: 'data' },
                { from: 'process1', to: 'output2', type: 'data' },
                { from: 'process2', to: 'output2', type: 'data' },
                { from: 'process3', to: 'output3', type: 'data' },
                { from: 'process4', to: 'output1', type: 'data' },
                { from: 'process5', to: 'output3', type: 'data' },
                { from: 'process1', to: 'output4', type: 'data' },
                { from: 'process3', to: 'output1', type: 'data' }
            ],
            optimized: [
                // 整齐的流程
                { from: 'input1', to: 'pre1', type: 'data' },
                { from: 'input2', to: 'pre1', type: 'data' },
                { from: 'input3', to: 'pre1', type: 'data' },
                { from: 'input4', to: 'pre1', type: 'data' },
                { from: 'pre1', to: 'pre2', type: 'data' },
                { from: 'pre2', to: 'pre3', type: 'data' },
                { from: 'pre3', to: 'core', type: 'data' },
                { from: 'core', to: 'func1', type: 'control' },
                { from: 'core', to: 'func2', type: 'control' },
                { from: 'core', to: 'func3', type: 'control' },
                { from: 'core', to: 'func4', type: 'control' },
                { from: 'func1', to: 'kb1', type: 'data' },
                { from: 'func2', to: 'kb2', type: 'data' },
                { from: 'func3', to: 'kb3', type: 'data' },
                { from: 'func4', to: 'kb4', type: 'data' },
                { from: 'kb1', to: 'out1', type: 'data' },
                { from: 'kb2', to: 'out3', type: 'data' },
                { from: 'kb3', to: 'out2', type: 'data' },
                { from: 'kb4', to: 'out4', type: 'data' },
                { from: 'meta1', to: 'core', type: 'meta' },
                { from: 'meta2', to: 'core', type: 'meta' },
                { from: 'meta3', to: 'core', type: 'meta' },
                { from: 'kb1', to: 'core', type: 'feedback' },
                { from: 'kb2', to: 'core', type: 'feedback' }
            ]
        };

        // 绘制美化的节点
        function drawNode(node) {
            const size = node.size || 50;
            const radius = size / 2;

            // 保存当前状态
            ctx.save();

            // 发光效果
            if (node.glow || node.pulse) {
                const glowSize = node.pulse ? 10 + Math.sin(animationFrame * 0.05) * 5 : 10;
                const gradient = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, radius + glowSize);
                gradient.addColorStop(0, node.color + '40');
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(node.x, node.y, radius + glowSize, 0, 2 * Math.PI);
                ctx.fill();
            }

            // 根据类型绘制不同形状
            let path = new Path2D();

            switch(node.type) {
                case 'input':
                case 'output':
                    // 圆形
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI);

                    // 渐变填充
                    const circleGradient = ctx.createRadialGradient(
                        node.x - radius/3, node.y - radius/3, 0,
                        node.x, node.y, radius
                    );
                    circleGradient.addColorStop(0, node.color + 'ff');
                    circleGradient.addColorStop(1, node.color + '99');
                    ctx.fillStyle = circleGradient;
                    ctx.fill();

                    // 边框
                    ctx.strokeStyle = node.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    break;

                case 'core':
                    // 六边形
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i;
                        const px = node.x + radius * Math.cos(angle);
                        const py = node.y + radius * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();

                    // 特殊渐变
                    const hexGradient = ctx.createLinearGradient(
                        node.x - radius, node.y - radius,
                        node.x + radius, node.y + radius
                    );
                    hexGradient.addColorStop(0, '#00ff88');
                    hexGradient.addColorStop(0.5, '#00b7ff');
                    hexGradient.addColorStop(1, '#00ff88');
                    ctx.fillStyle = hexGradient;
                    ctx.fill();

                    ctx.strokeStyle = '#00ff88';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    break;

                case 'meta':
                    // 菱形
                    ctx.beginPath();
                    ctx.moveTo(node.x, node.y - radius);
                    ctx.lineTo(node.x + radius, node.y);
                    ctx.lineTo(node.x, node.y + radius);
                    ctx.lineTo(node.x - radius, node.y);
                    ctx.closePath();

                    const diamondGradient = ctx.createLinearGradient(
                        node.x - radius, node.y,
                        node.x + radius, node.y
                    );
                    diamondGradient.addColorStop(0, node.color + 'cc');
                    diamondGradient.addColorStop(1, node.color + 'ff');
                    ctx.fillStyle = diamondGradient;
                    ctx.fill();

                    ctx.strokeStyle = node.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    break;

                default:
                    // 圆角矩形
                    drawRoundRect(node.x - radius, node.y - 25, radius * 2, 50, 15, node.color);
                    break;
            }

            // 绘制图标
            if (node.icon) {
                ctx.font = '20px Apple Color Emoji, Segoe UI Emoji';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'white';
                ctx.fillText(node.icon, node.x, node.y - 5);
            }

            // 绘制标签
            ctx.fillStyle = 'white';
            ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, Segoe UI';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 3;
            ctx.fillText(node.label, node.x, node.y + radius + 20);

            ctx.restore();
        }

        // 绘制圆角矩形
        function drawRoundRect(x, y, width, height, radius, color) {
            // 渐变
            const rectGradient = ctx.createLinearGradient(x, y, x + width, y + height);
            rectGradient.addColorStop(0, color + 'ff');
            rectGradient.addColorStop(1, color + 'cc');

            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();

            ctx.fillStyle = rectGradient;
            ctx.fill();

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // 绘制美化的连接线
        function drawConnection(connection) {
            const fromNode = nodes[currentView][connection.from];
            const toNode = nodes[currentView][connection.to];

            if (!fromNode || !toNode) return;

            ctx.save();

            // 设置线条样式
            let gradient;
            switch(connection.type) {
                case 'data':
                    gradient = ctx.createLinearGradient(fromNode.x, fromNode.y, toNode.x, toNode.y);
                    gradient.addColorStop(0, '#00ff88');
                    gradient.addColorStop(1, '#00cc66');
                    ctx.strokeStyle = gradient;
                    ctx.setLineDash([]);
                    ctx.lineWidth = 2;
                    break;
                case 'control':
                    gradient = ctx.createLinearGradient(fromNode.x, fromNode.y, toNode.x, toNode.y);
                    gradient.addColorStop(0, '#ff9800');
                    gradient.addColorStop(1, '#ff6b00');
                    ctx.strokeStyle = gradient;
                    ctx.setLineDash([8, 4]);
                    ctx.lineWidth = 2;
                    break;
                case 'feedback':
                    gradient = ctx.createLinearGradient(fromNode.x, fromNode.y, toNode.x, toNode.y);
                    gradient.addColorStop(0, '#00b7ff');
                    gradient.addColorStop(1, '#0083b0');
                    ctx.strokeStyle = gradient;
                    ctx.setLineDash([12, 6]);
                    ctx.lineWidth = 1.5;
                    break;
                case 'meta':
                    gradient = ctx.createLinearGradient(fromNode.x, fromNode.y, toNode.x, toNode.y);
                    gradient.addColorStop(0, '#e91e63');
                    gradient.addColorStop(1, '#c2185b');
                    ctx.strokeStyle = gradient;
                    ctx.setLineDash([4, 4]);
                    ctx.lineWidth = 2;
                    break;
            }

            // 绘制贝塞尔曲线
            ctx.beginPath();
            ctx.moveTo(fromNode.x, fromNode.y);

            const dx = toNode.x - fromNode.x;
            const dy = toNode.y - fromNode.y;
            const ctrl1x = fromNode.x + dx * 0.5;
            const ctrl1y = fromNode.y;
            const ctrl2x = toNode.x - dx * 0.5;
            const ctrl2y = toNode.y;

            ctx.bezierCurveTo(ctrl1x, ctrl1y, ctrl2x, ctrl2y, toNode.x, toNode.y);
            ctx.stroke();

            // 绘制箭头
            const angle = Math.atan2(toNode.y - ctrl2y, toNode.x - ctrl2x);
            const arrowLength = 12;
            const arrowAngle = Math.PI / 6;

            ctx.save();
            ctx.translate(toNode.x, toNode.y);
            ctx.rotate(angle);
            ctx.translate(-30, 0);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-arrowLength * Math.cos(arrowAngle), -arrowLength * Math.sin(arrowAngle));
            ctx.moveTo(0, 0);
            ctx.lineTo(-arrowLength * Math.cos(arrowAngle), arrowLength * Math.sin(arrowAngle));
            ctx.stroke();

            ctx.restore();
            ctx.restore();
        }

        // 绘制流动粒子
        function drawFlowParticle(connection, offset) {
            const fromNode = nodes[currentView][connection.from];
            const toNode = nodes[currentView][connection.to];

            if (!fromNode || !toNode) return;

            const t = ((animationFrame + offset) % 100) / 100;

            // 计算贝塞尔曲线上的点
            const dx = toNode.x - fromNode.x;
            const dy = toNode.y - fromNode.y;
            const ctrl1x = fromNode.x + dx * 0.5;
            const ctrl1y = fromNode.y;
            const ctrl2x = toNode.x - dx * 0.5;
            const ctrl2y = toNode.y;

            // 贝塞尔曲线公式
            const x = Math.pow(1-t, 3) * fromNode.x +
                     3 * Math.pow(1-t, 2) * t * ctrl1x +
                     3 * (1-t) * Math.pow(t, 2) * ctrl2x +
                     Math.pow(t, 3) * toNode.x;

            const y = Math.pow(1-t, 3) * fromNode.y +
                     3 * Math.pow(1-t, 2) * t * ctrl1y +
                     3 * (1-t) * Math.pow(t, 2) * ctrl2y +
                     Math.pow(t, 3) * toNode.y;

            // 绘制发光粒子
            const particleGradient = ctx.createRadialGradient(x, y, 0, x, y, 8);

            switch(connection.type) {
                case 'data':
                    particleGradient.addColorStop(0, 'rgba(0, 255, 136, 1)');
                    particleGradient.addColorStop(1, 'rgba(0, 255, 136, 0)');
                    break;
                case 'control':
                    particleGradient.addColorStop(0, 'rgba(255, 152, 0, 1)');
                    particleGradient.addColorStop(1, 'rgba(255, 152, 0, 0)');
                    break;
                case 'feedback':
                    particleGradient.addColorStop(0, 'rgba(0, 183, 255, 1)');
                    particleGradient.addColorStop(1, 'rgba(0, 183, 255, 0)');
                    break;
                case 'meta':
                    particleGradient.addColorStop(0, 'rgba(233, 30, 99, 1)');
                    particleGradient.addColorStop(1, 'rgba(233, 30, 99, 0)');
                    break;
            }

            ctx.fillStyle = particleGradient;
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, 2 * Math.PI);
            ctx.fill();

            // 内核
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, 2 * Math.PI);
            ctx.fill();
        }

        // 更新统计信息
        function updateStats() {
            const statsContainer = document.getElementById('stats');

            if (currentView === 'optimized') {
                statsContainer.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-number">80%</div>
                        <div class="stat-label">自动化率</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">3X</div>
                        <div class="stat-label">处理速度</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">95%</div>
                        <div class="stat-label">准确率</div>
                    </div>
                `;
            } else {
                statsContainer.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-number" style="color: #ff4757;">30%</div>
                        <div class="stat-label">自动化率</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" style="color: #ff4757;">1X</div>
                        <div class="stat-label">处理速度</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" style="color: #ff4757;">60%</div>
                        <div class="stat-label">准确率</div>
                    </div>
                `;
            }
        }

        // 主绘制函数
        function draw() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制所有连接
            connections[currentView].forEach(conn => {
                drawConnection(conn);
            });

            // 绘制流动粒子
            if (animationEnabled) {
                connections[currentView].forEach((conn, index) => {
                    if (conn.type === 'data' || conn.type === 'control') {
                        drawFlowParticle(conn, index * 20);
                    }
                });
            }

            // 绘制所有节点
            Object.values(nodes[currentView]).forEach(node => {
                drawNode(node);
            });

            // 更新动画
            if (animationEnabled) {
                animationFrame++;
                requestAnimationFrame(draw);
            }
        }

        // 视图切换
        function showView(view) {
            currentView = view;
            updateStats();
            document.querySelectorAll('.btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            draw();
        }

        // 动画开关
        function toggleAnimation() {
            animationEnabled = !animationEnabled;
            if (animationEnabled) {
                draw();
            }
        }

        // 重置视图
        function resetView() {
            animationFrame = 0;
            draw();
        }

        // 鼠标交互
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;

            let hoverNode = null;
            Object.entries(nodes[currentView]).forEach(([key, node]) => {
                const distance = Math.sqrt(Math.pow(mouseX - node.x, 2) + Math.pow(mouseY - node.y, 2));
                if (distance < 35) {
                    hoverNode = node;
                }
            });

            if (hoverNode) {
                tooltip.style.display = 'block';
                tooltip.style.left = e.clientX + 'px';
                tooltip.style.top = (e.clientY - 50) + 'px';
                tooltip.innerHTML = `
                    <div style="font-weight: bold;">${hoverNode.label}</div>
                    <div style="font-size: 11px; opacity: 0.8; margin-top: 4px;">类型: ${hoverNode.type}</div>
                `;
                canvas.style.cursor = 'pointer';
            } else {
                tooltip.style.display = 'none';
                canvas.style.cursor = 'default';
            }
        });

        // 初始化
        updateStats();
        draw();
    </script>
</body>
</html>
