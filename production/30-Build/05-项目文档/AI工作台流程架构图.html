<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI工作台流程架构图 - All-In System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #00B4DB 0%, #0083B0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .control-panel {
            background: white;
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            background: #f0f0f0;
        }

        .btn:hover {
            background: #00B4DB;
            color: white;
            transform: translateY(-2px);
        }

        .btn.active {
            background: #00B4DB;
            color: white;
        }

        #canvas-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            overflow: auto;
            max-width: 1400px;
            width: 100%;
        }

        #architecture-canvas {
            display: block;
            margin: 0 auto;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }

        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .legend-color {
            width: 30px;
            height: 3px;
            margin-right: 10px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <h1>🔗 AI工作台流程架构图</h1>

    <div class="control-panel">
        <button class="btn active" onclick="showView('current')">当前架构</button>
        <button class="btn" onclick="showView('optimized')">优化架构</button>
        <button class="btn" onclick="toggleAnimation()">动画开关</button>
        <button class="btn" onclick="resetView()">重置视图</button>
    </div>

    <div id="canvas-container">
        <canvas id="architecture-canvas"></canvas>
        <div class="tooltip" id="tooltip"></div>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #4CAF50;"></div>
                <span>数据流</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FF9800;"></div>
                <span>控制流</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #2196F3;"></div>
                <span>反馈流</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #9C27B0;"></div>
                <span>元规则</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('architecture-canvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');

        // 设置画布大小
        canvas.width = 1200;
        canvas.height = 800;

        // 动画控制
        let animationEnabled = true;
        let animationFrame = 0;
        let currentView = 'current';

        // 节点定义
        const nodes = {
            current: {
                // 输入层
                input1: { x: 100, y: 200, label: '语音输入', type: 'input', color: '#FF5252' },
                input2: { x: 100, y: 280, label: '文字对话', type: 'input', color: '#FF5252' },
                input3: { x: 100, y: 360, label: '文件上传', type: 'input', color: '#FF5252' },
                input4: { x: 100, y: 440, label: '录音文件', type: 'input', color: '#FF5252' },
                input5: { x: 100, y: 520, label: '网页内容', type: 'input', color: '#FF5252' },

                // 处理层（混乱）
                process1: { x: 400, y: 180, label: '聊天汇总', type: 'process', color: '#FFA726' },
                process2: { x: 400, y: 280, label: '聊天总结', type: 'process', color: '#FFA726' },
                process3: { x: 400, y: 380, label: '经验汇总', type: 'process', color: '#FFA726' },
                process4: { x: 400, y: 480, label: '录音整理', type: 'process', color: '#FFA726' },
                process5: { x: 400, y: 580, label: '内容分析', type: 'process', color: '#FFA726' },

                // 输出层
                output1: { x: 700, y: 230, label: 'Markdown文档', type: 'output', color: '#66BB6A' },
                output2: { x: 700, y: 330, label: '对话记录', type: 'output', color: '#66BB6A' },
                output3: { x: 700, y: 430, label: '分析报告', type: 'output', color: '#66BB6A' },
                output4: { x: 700, y: 530, label: '任务清单', type: 'output', color: '#66BB6A' }
            },
            optimized: {
                // 输入层
                input1: { x: 80, y: 300, label: '对话输入', type: 'input', color: '#42A5F5' },
                input2: { x: 80, y: 380, label: '文件输入', type: 'input', color: '#42A5F5' },
                input3: { x: 80, y: 460, label: '网络输入', type: 'input', color: '#42A5F5' },
                input4: { x: 80, y: 540, label: '音频输入', type: 'input', color: '#42A5F5' },

                // 预处理层
                pre1: { x: 250, y: 340, label: '格式转换', type: 'preprocess', color: '#26C6DA' },
                pre2: { x: 250, y: 420, label: '内容识别', type: 'preprocess', color: '#26C6DA' },
                pre3: { x: 250, y: 500, label: '分类标记', type: 'preprocess', color: '#26C6DA' },

                // 核心引擎
                core: { x: 450, y: 420, label: '智能调度中心', type: 'core', color: '#00BCD4', size: 60 },

                // 功能模块
                func1: { x: 600, y: 320, label: '信息提取', type: 'function', color: '#4CAF50' },
                func2: { x: 600, y: 400, label: '内容分析', type: 'function', color: '#4CAF50' },
                func3: { x: 600, y: 480, label: '知识整理', type: 'function', color: '#4CAF50' },
                func4: { x: 600, y: 560, label: '任务管理', type: 'function', color: '#4CAF50' },

                // 知识库
                kb1: { x: 800, y: 300, label: '对话历史', type: 'knowledge', color: '#FF9800' },
                kb2: { x: 800, y: 380, label: '知识图谱', type: 'knowledge', color: '#FF9800' },
                kb3: { x: 800, y: 460, label: '经验总结', type: 'knowledge', color: '#FF9800' },
                kb4: { x: 800, y: 540, label: '模板库', type: 'knowledge', color: '#FF9800' },

                // 输出层
                out1: { x: 1000, y: 320, label: '实时记录', type: 'output', color: '#8BC34A' },
                out2: { x: 1000, y: 400, label: '定期报告', type: 'output', color: '#8BC34A' },
                out3: { x: 1000, y: 480, label: '知识文档', type: 'output', color: '#8BC34A' },
                out4: { x: 1000, y: 560, label: '任务看板', type: 'output', color: '#8BC34A' },

                // 元规则系统
                meta1: { x: 450, y: 150, label: '工作流规则', type: 'meta', color: '#9C27B0' },
                meta2: { x: 450, y: 220, label: '自动化触发', type: 'meta', color: '#9C27B0' },
                meta3: { x: 450, y: 290, label: '输出模板', type: 'meta', color: '#9C27B0' }
            }
        };

        // 连接定义
        const connections = {
            current: [
                // 输入到处理（混乱的多对多）
                { from: 'input1', to: 'process1', type: 'data' },
                { from: 'input1', to: 'process2', type: 'data' },
                { from: 'input2', to: 'process1', type: 'data' },
                { from: 'input2', to: 'process2', type: 'data' },
                { from: 'input3', to: 'process3', type: 'data' },
                { from: 'input3', to: 'process5', type: 'data' },
                { from: 'input4', to: 'process4', type: 'data' },
                { from: 'input5', to: 'process5', type: 'data' },

                // 处理到输出（交叉混乱）
                { from: 'process1', to: 'output2', type: 'data' },
                { from: 'process2', to: 'output2', type: 'data' },
                { from: 'process3', to: 'output3', type: 'data' },
                { from: 'process4', to: 'output1', type: 'data' },
                { from: 'process5', to: 'output3', type: 'data' },
                { from: 'process1', to: 'output4', type: 'data' }
            ],
            optimized: [
                // 输入到预处理
                { from: 'input1', to: 'pre1', type: 'data' },
                { from: 'input2', to: 'pre1', type: 'data' },
                { from: 'input3', to: 'pre1', type: 'data' },
                { from: 'input4', to: 'pre1', type: 'data' },

                // 预处理链
                { from: 'pre1', to: 'pre2', type: 'data' },
                { from: 'pre2', to: 'pre3', type: 'data' },
                { from: 'pre3', to: 'core', type: 'data' },

                // 核心到功能模块
                { from: 'core', to: 'func1', type: 'control' },
                { from: 'core', to: 'func2', type: 'control' },
                { from: 'core', to: 'func3', type: 'control' },
                { from: 'core', to: 'func4', type: 'control' },

                // 功能到知识库
                { from: 'func1', to: 'kb1', type: 'data' },
                { from: 'func2', to: 'kb2', type: 'data' },
                { from: 'func3', to: 'kb3', type: 'data' },
                { from: 'func4', to: 'kb4', type: 'data' },

                // 知识库到输出
                { from: 'kb1', to: 'out1', type: 'data' },
                { from: 'kb2', to: 'out3', type: 'data' },
                { from: 'kb3', to: 'out2', type: 'data' },
                { from: 'kb4', to: 'out4', type: 'data' },

                // 元规则控制
                { from: 'meta1', to: 'core', type: 'meta' },
                { from: 'meta2', to: 'core', type: 'meta' },
                { from: 'meta3', to: 'core', type: 'meta' },

                // 反馈循环
                { from: 'kb1', to: 'core', type: 'feedback' },
                { from: 'kb2', to: 'core', type: 'feedback' },
                { from: 'out1', to: 'meta1', type: 'feedback' }
            ]
        };

        // 绘制节点
        function drawNode(node) {
            const size = node.size || 40;

            // 绘制阴影
            ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            // 根据类型绘制不同形状
            ctx.fillStyle = node.color;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;

            switch(node.type) {
                case 'input':
                    // 圆形
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, size/2, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.stroke();
                    break;
                case 'core':
                    // 六边形
                    drawHexagon(node.x, node.y, size/2);
                    break;
                case 'meta':
                    // 菱形
                    drawDiamond(node.x, node.y, size/2);
                    break;
                default:
                    // 圆角矩形
                    drawRoundRect(node.x - size/2, node.y - 20, size + 20, 40, 10);
                    break;
            }

            // 重置阴影
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // 绘制文字
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(node.label, node.x, node.y);
        }

        // 绘制圆角矩形
        function drawRoundRect(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        // 绘制六边形
        function drawHexagon(x, y, size) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const px = x + size * Math.cos(angle);
                const py = y + size * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        // 绘制菱形
        function drawDiamond(x, y, size) {
            ctx.beginPath();
            ctx.moveTo(x, y - size);
            ctx.lineTo(x + size, y);
            ctx.lineTo(x, y + size);
            ctx.lineTo(x - size, y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        // 绘制连接线
        function drawConnection(connection, progress = 1) {
            const fromNode = nodes[currentView][connection.from];
            const toNode = nodes[currentView][connection.to];

            if (!fromNode || !toNode) return;

            // 设置线条样式
            switch(connection.type) {
                case 'data':
                    ctx.strokeStyle = '#4CAF50';
                    ctx.setLineDash([]);
                    ctx.lineWidth = 2;
                    break;
                case 'control':
                    ctx.strokeStyle = '#FF9800';
                    ctx.setLineDash([5, 5]);
                    ctx.lineWidth = 2;
                    break;
                case 'feedback':
                    ctx.strokeStyle = '#2196F3';
                    ctx.setLineDash([10, 5]);
                    ctx.lineWidth = 1.5;
                    break;
                case 'meta':
                    ctx.strokeStyle = '#9C27B0';
                    ctx.setLineDash([3, 3]);
                    ctx.lineWidth = 2;
                    break;
            }

            // 计算贝塞尔曲线控制点
            const dx = toNode.x - fromNode.x;
            const dy = toNode.y - fromNode.y;
            const ctrl1x = fromNode.x + dx * 0.3;
            const ctrl1y = fromNode.y;
            const ctrl2x = toNode.x - dx * 0.3;
            const ctrl2y = toNode.y;

            // 绘制贝塞尔曲线
            ctx.beginPath();
            ctx.moveTo(fromNode.x, fromNode.y);

            if (Math.abs(dy) < 50) {
                // 水平连接用直线
                ctx.lineTo(toNode.x * progress + fromNode.x * (1 - progress), toNode.y);
            } else {
                // 其他用曲线
                ctx.bezierCurveTo(
                    ctrl1x, ctrl1y,
                    ctrl2x, ctrl2y,
                    toNode.x * progress + fromNode.x * (1 - progress),
                    toNode.y * progress + fromNode.y * (1 - progress)
                );
            }

            ctx.stroke();

            // 绘制箭头
            if (progress >= 1) {
                const angle = Math.atan2(toNode.y - fromNode.y, toNode.x - fromNode.x);
                const arrowLength = 10;
                const arrowAngle = Math.PI / 6;

                ctx.save();
                ctx.translate(toNode.x - Math.cos(angle) * 30, toNode.y - Math.sin(angle) * 30);
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-arrowLength * Math.cos(arrowAngle), -arrowLength * Math.sin(arrowAngle));
                ctx.moveTo(0, 0);
                ctx.lineTo(-arrowLength * Math.cos(arrowAngle), arrowLength * Math.sin(arrowAngle));
                ctx.stroke();

                ctx.restore();
            }

            ctx.setLineDash([]);
        }

        // 绘制流动效果
        function drawFlowAnimation(connection) {
            const fromNode = nodes[currentView][connection.from];
            const toNode = nodes[currentView][connection.to];

            if (!fromNode || !toNode) return;

            const t = (animationFrame % 60) / 60;
            const x = fromNode.x + (toNode.x - fromNode.x) * t;
            const y = fromNode.y + (toNode.y - fromNode.y) * t;

            ctx.fillStyle = connection.type === 'data' ? '#4CAF50' :
                           connection.type === 'control' ? '#FF9800' :
                           connection.type === 'feedback' ? '#2196F3' : '#9C27B0';
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, 2 * Math.PI);
            ctx.fill();
        }

        // 主绘制函数
        function draw() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制标题
            ctx.fillStyle = '#333';
            ctx.font = 'bold 20px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText(currentView === 'current' ? '当前架构（存在问题）' : '优化架构（解决方案）', canvas.width / 2, 30);

            // 绘制所有连接
            connections[currentView].forEach(conn => {
                drawConnection(conn);
            });

            // 绘制流动动画
            if (animationEnabled) {
                connections[currentView].forEach(conn => {
                    if (conn.type === 'data') {
                        drawFlowAnimation(conn);
                    }
                });
            }

            // 绘制所有节点
            Object.values(nodes[currentView]).forEach(node => {
                drawNode(node);
            });

            // 更新动画帧
            if (animationEnabled) {
                animationFrame++;
                requestAnimationFrame(draw);
            }
        }

        // 视图切换
        function showView(view) {
            currentView = view;
            document.querySelectorAll('.btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            draw();
        }

        // 动画开关
        function toggleAnimation() {
            animationEnabled = !animationEnabled;
            if (animationEnabled) {
                draw();
            }
        }

        // 重置视图
        function resetView() {
            animationFrame = 0;
            draw();
        }

        // 鼠标交互
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            let hoverNode = null;
            Object.entries(nodes[currentView]).forEach(([key, node]) => {
                const distance = Math.sqrt(Math.pow(x - node.x, 2) + Math.pow(y - node.y, 2));
                if (distance < 30) {
                    hoverNode = node;
                }
            });

            if (hoverNode) {
                tooltip.style.display = 'block';
                tooltip.style.left = e.clientX + 10 + 'px';
                tooltip.style.top = e.clientY - 30 + 'px';
                tooltip.textContent = `${hoverNode.label} (${hoverNode.type})`;
                canvas.style.cursor = 'pointer';
            } else {
                tooltip.style.display = 'none';
                canvas.style.cursor = 'default';
            }
        });

        // 初始化
        draw();
    </script>
</body>
</html>
